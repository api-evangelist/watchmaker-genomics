- id: soap-1.2
  conforms: true
  evidence: The captured WSDL binds soap12 as well as soap 1.1 transports.
- id: rfc9457
  conforms: false
  evidence: >-
    Errors use the Magento error-response envelope ({message, parameters, errors, code, trace}),
