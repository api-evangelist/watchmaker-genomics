  from Adobe, Fastly or any other vendor whose infrastructure sits under this storefront. No
  Compliance pointer is wired into apis.yml, because Watchmaker publishes no certification,
  attestation or compliance program page — probed /quality-and-compliance 404,
  /certifications 404, trust.watchmakergenomics.com NXDOMAIN.

conformance:
