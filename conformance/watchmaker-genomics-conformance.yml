domain_standards:
- id: ga4gh-file-formats
  label: Genomics file formats (SAM/BAM/CRAM, FASTA, VCF)
  conforms: true
  surface: cli
  evidence: >-
    https://github.com/watchmaker-genomics/TVC — the TAPS+ Variant Caller takes an indexed
    reference FASTA (.fai) and an aligned BAM (.bai, NM tag required) and emits VCF. The
    published option set (--min-bq, --min-mapq, --min-depth, --min-ao) is expressed in the
    domain's own vocabulary.
  note: >-
    This is file-format conformance in a first-party command-line tool, NOT a signature in an API
    contract. It is recorded here because it is the only domain-standard signal Watchmaker
    publishes, and it is deliberately scoped `surface: cli` so it is not read as a contract-level
    domain_standard_conformance signature.
- id: fhir
  conforms: false
  evidence: >-
    Checked because the health / life-sciences regulatory regime lists FHIR first. Watchmaker is a
    reagents manufacturer; it processes no patient data through any published interface and
    serves no CapabilityStatement. Not applicable rather than failed.
- id: ecommerce-domain-standard
  conforms: false
  evidence: >-
    The commerce surface declares no schema.org Product feed endpoint, no OpenRTB, no EDI/X12
    ordering surface and no GS1 identifiers in the contract. Product identity is a Magento SKU
    (for example 7K0116-7K0117-7K0118-7K0120-7K0121) with no external standard scheme attached.

