    636-type schema (GraphQL June 2018 introspection shape, __schema/__Type/__Field), captured
    verbatim as graphql/watchmaker-genomics-commerce.graphql.
- id: swagger-2.0
  conforms: true
  evidence: >-
    https://www.watchmakergenomics.com/rest/all/schema?services=all returns a document declaring
    "swagger":"2.0" with 61 paths, 70 operations, 124 definitions and a securityDefinitions block.
- id: openapi-3
  conforms: false
  evidence: >-
    The self-served contract is Swagger 2.0 only. /openapi.json, /openapi.yaml and /swagger.json
    on www.watchmakergenomics.com all return 404 with an HTML Magento error page.
- id: wsdl-1.1
  conforms: true
  evidence: >-
    https://www.watchmakergenomics.com/soap/all?wsdl&services=... returns a WSDL 1.1 document
