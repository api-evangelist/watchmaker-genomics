apis:
- name: Watchmaker Genomics Storefront GraphQL API
  description: >-
    The Adobe Commerce (Magento 2) storefront GraphQL API instantiated on Watchmaker Genomics'
    own host. Fully introspectable without credentials — 636 types, 54 root query fields and 99
    mutations covering the Watchmaker product catalog, category tree, search, CMS pages, guest and
    customer carts, checkout, shipping and payment method selection, order placement, wishlists,
    gift registry, product reviews, newsletter subscription and the contact-us form. Live queries
    return Watchmaker's own SKUs and storeConfig.base_url resolves to
    https://www.watchmakergenomics.com/.
  humanURL: https://www.watchmakergenomics.com/products
  baseURL: https://www.watchmakergenomics.com/graphql
  tags:
  - E-Commerce
  - GraphQL
  - Product Catalog
  - Adobe Commerce
  properties:
  - type: GraphQL
    url: graphql/watchmaker-genomics-commerce.graphql
  - type: DataModel
    url: data-model/watchmaker-genomics-data-model.yml
  - type: Authentication
    url: authentication/watchmaker-genomics-authentication.yml
- name: Watchmaker Genomics Storefront REST API
  description: >-
    The Adobe Commerce REST API on Watchmaker Genomics' own host, self-describing at
    /rest/all/schema?services=all as a Swagger 2.0 document with 61 paths and 70 operations. The
    anonymous slice — directory currency and countries, product render info, guest carts, shipping
    and payment estimation, guest order placement, customer account creation and password reset,
    gift cards, in-store pickup locations, search and the Magefan blog module — answers without a
    token; everything else requires a Magento integration API key.
  humanURL: https://www.watchmakergenomics.com/rest/all/schema?services=all
  baseURL: https://www.watchmakergenomics.com/rest/all
  tags:
  - E-Commerce
  - REST
  - Product Catalog
  - Adobe Commerce
  properties:
  - type: OpenAPI
    url: openapi/watchmaker-genomics-commerce-rest-swagger.json
  - type: Overlay
    url: overlays/watchmaker-genomics-commerce-rest-overlay.yaml
  - type: ErrorCatalog
    url: errors/watchmaker-genomics-problem-types.yml
  - type: Authentication
    url: authentication/watchmaker-genomics-authentication.yml
  - type: DataModel
    url: data-model/watchmaker-genomics-data-model.yml
- name: Watchmaker Genomics Storefront SOAP API
  description: >-
    The Adobe Commerce SOAP surface on Watchmaker Genomics' own host. /soap/all?wsdl_list=1
    enumerates 200 services and each returns a WSDL 1.1 contract whose target namespace is
    https://www.watchmakergenomics.com/soap/all. A five-service sample covering directory,
    store, guest cart and customer-account operations is captured verbatim.
  humanURL: https://www.watchmakergenomics.com/soap/all?wsdl_list=1
  baseURL: https://www.watchmakergenomics.com/soap/all
  tags:
  - E-Commerce
  - SOAP
  - Adobe Commerce
  properties:
  - type: WSDL
    url: wsdl/watchmaker-genomics-commerce-soap.wsdl
