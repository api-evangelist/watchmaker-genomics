aid: watchmaker-genomics
name: Watchmaker Genomics
description: >-
  Watchmaker Genomics is a Boulder, Colorado life-science company that engineers and manufactures
  high-performance enzymes and next-generation-sequencing library preparation kits for clinical,
  translational and molecular-diagnostics workflows — DNA and RNA library prep, TAPS+ methylation
  sequencing, EquiPlex normalization, Equinox Prime amplification, high-fidelity polymerases,
  reverse transcriptases and MDx reagents. It is a reagents manufacturer rather than an API
  company: it runs no developer program and publishes no API documentation, but its Adobe
  Commerce (Magento 2) storefront at www.watchmakergenomics.com serves a live, publicly
  introspectable GraphQL endpoint, a Swagger 2.0 REST schema and 200 SOAP WSDL services over its
  own product catalog, and its GitHub organization publishes first-party bioinformatics tools
  including the TAPS+ Variant Caller (TVC).
image: https://www.watchmakergenomics.com/media/codazon/logo/22/default/Watchmaker_Logo_RGB_Wtext_500px.png
url: https://raw.githubusercontent.com/api-evangelist/watchmaker-genomics/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
position: Producing
specificationVersion: '0.20'
created: '2026-09-04'
modified: '2026-09-04'
tags:
- Genomics
- Life Sciences
- Next-Generation Sequencing
- Molecular Diagnostics
- Biotechnology
- Reagents
- Bioinformatics
- E-Commerce
- GraphQL
- Adobe Commerce
apis:
- name: Watchmaker Genomics Storefront GraphQL API
  description: >-
    The Adobe Commerce (Magento 2) storefront GraphQL API instantiated on Watchmaker Genomics' own host.
    Fully introspectable without credentials — 636 types, 54 root query fields and 99 mutations covering
    the Watchmaker product catalog, category tree, search, CMS pages, guest and customer carts, checkout,
    shipping and payment method selection, order placement, wishlists, gift registry, product reviews,
    newsletter subscription and the contact-us form. Live queries return Watchmaker's own SKUs and storeConfig.base_url
    resolves to https://www.watchmakergenomics.com/.
  humanURL: https://www.watchmakergenomics.com/products
  baseURL: https://www.watchmakergenomics.com/graphql
  tags:
  - E-Commerce
  - GraphQL
  - Product Catalog
  - Adobe Commerce
  properties:
  - type: GraphQL
    url: graphql/watchmaker-genomics-commerce.graphql
  - type: DataModel
    url: data-model/watchmaker-genomics-data-model.yml
  - type: Authentication
    url: authentication/watchmaker-genomics-authentication.yml
- name: Watchmaker Genomics Storefront SOAP API
  description: >-
    The Adobe Commerce SOAP surface on Watchmaker Genomics' own host. /soap/all?wsdl_list=1 enumerates
    200 services and each returns a WSDL 1.1 contract whose target namespace is https://www.watchmakergenomics.com/soap/all.
    A five-service sample covering directory, store, guest cart and customer-account operations is captured
    verbatim.
  humanURL: https://www.watchmakergenomics.com/soap/all?wsdl_list=1
  baseURL: https://www.watchmakergenomics.com/soap/all
  tags:
  - E-Commerce
  - SOAP
  - Adobe Commerce
  properties:
  - type: WSDL
    url: wsdl/watchmaker-genomics-commerce-soap.wsdl
