rest_definitions_note: >-
  The Swagger's 124 definitions cover the same core but only where the anonymous REST slice
  touches it — customer-data-customer-interface, quote-data-cart-interface,
  quote-data-totals-interface, quote-data-shipping-method-interface,
  directory-data-country-information-interface, catalog-data-product-render-interface,
  inventory-in-store-pickup-api-data-pickup-location-interface, plus the Magefan blog models and
  the error-response family. There is NO product or category definition in the REST schema —
  see mcp/watchmaker-genomics-tool-crosswalk.yml.
