note: >-
  The entity graph of the Adobe Commerce data core as it is instantiated on Watchmaker Genomics'
  own host. Types and field names are read from the contracts; the identifiers and the module set
  (gift registry, gift cards, reward points, store credit, in-store pickup, Magefan blog, Codazon
  theme, Adobe Payment Services, Braintree) are what THIS deployment actually carries. Only the
  entities reachable from an anonymous caller are described in detail — the rest are named.
