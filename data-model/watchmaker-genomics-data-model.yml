  cart: 'Opaque masked quote id (String) for guest carts; integer quote id server-side.'
  entity_uid: 'Base64-encoded uid on catalog entities (ProductInterface.uid, CategoryInterface.uid), the modern replacement for the integer id fields.'
  order: 'order_number (human) plus an opaque order id used by cancelOrder.'
